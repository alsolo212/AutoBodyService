<button class="button button--secondary logout-button" type="button" (click)="open()" [disabled]="loggingOut()">{{ loggingOut() ? 'Виходимо…' : 'Вийти' }}</button>
@if (error()) { <p class="auth-alert" role="alert">{{ error() }}</p> }
<app-confirm-dialog [dialogId]="dialogId" title="Вийти з облікового запису?" description="Щоб знову переглядати записи та керувати ними, потрібно буде увійти." cancelLabel="Залишитися" confirmLabel="Вийти" (confirmed)="logout()" />
